# The agent pipelines of this repo (smydolf/agent-platform#38).
# Temporary place until smydolf/agent-platform#14 decides.
triage:
  on: [new-item, manual]
  steps: [triage]

coder:
  on: [tag:ready-for-agent, manual]
  steps:
    - rounds:
        steps:
          - coder
          - tester
          - reviewer: {checks: [agent-platform:review-spec, agent-platform:review-bugs, agent-platform:review-standards, agent-platform:review-security, repo:file-header]}
        max: 3
    - draft-pr
    - owner: {text: "Test the change in the app", app: true, talk: coder}
