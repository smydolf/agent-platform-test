# The agent pipelines of this repo (smydolf/agent-platform#38).
# Temporary place until smydolf/agent-platform#14 decides.
triage:
  on: [new-item, tag:needs-triage, manual]
  steps: [triage]

coder:
  on: [tag:ready-for-agent, manual]
  steps:
    - rounds:
        steps:
          - coder
          - tester
          - reviewer: {checks: [agent-platform:review-spec, agent-platform:review-bugs, agent-platform:review-standards, agent-platform:review-security, repo:file-header]}
        max: 3
    - draft-pr
    - owner: {text: "Test the change in the app", app: true, talk: coder}

# A test pipeline for the "not passed" result (smydolf/agent-platform#41): one round only.
coder-once:
  on: [manual]
  steps:
    - rounds:
        steps:
          - coder
          - tester
          - reviewer: {checks: [agent-platform:review-spec, agent-platform:review-bugs, agent-platform:review-standards, agent-platform:review-security, repo:file-header]}
        max: 1
    - draft-pr
    - owner: {text: "Test the change in the app", app: true, talk: coder}

# A test pipeline for the investigator (smydolf/agent-platform#55). Test data only until #6 closes.
client-question:
  on: [client-question]
  steps:
    - investigator: {env: test, time: 20m, turns: 100}
    - owner: "Check the answer before the client sees it"
    - post-answer
